[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
license = "MIT"
repository = "https://github.com/gpietr/hogs"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
hogs-core = { path = "crates/core" }
hogs-scan = { path = "crates/scan" }
anyhow = "1"
dunce = "1.0"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
